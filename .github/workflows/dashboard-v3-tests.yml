name: Dashboard v3 tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'v3/**'
      - 'v2/tablet/**'
      - 'v2/tests/**'
      - '.github/workflows/dashboard-v3-tests.yml'
  pull_request:
    paths:
      - 'v3/**'
      - 'v2/tablet/**'
      - 'v2/tests/**'
      - '.github/workflows/dashboard-v3-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: |
          python -m pip install -r v1/requirements.txt
          sudo -n apt-get update
          sudo -n apt-get install -y qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - name: Test shared updater and launcher
        run: |
          sh -n v2/tablet/update.sh
          sh -n v3/tablet/launch.sh
          python -m unittest discover -s v2/tests -p test_tablet.py -v
          python -m unittest discover -s v3/tests -p 'test_*.py' -v
      - name: Build and test native viewer
        run: |
          cmake -S v3 -B v3/build -DBUILD_TESTING=ON
          cmake --build v3/build --parallel 2
          ctest --test-dir v3/build --output-on-failure
